auth_enabled: false

server:
  http_listen_port: 3100
  # fat log lines (full raw records) can exceed the 4MiB internal gRPC default
  grpc_server_max_recv_msg_size: 33554432
  grpc_server_max_send_msg_size: 33554432

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
